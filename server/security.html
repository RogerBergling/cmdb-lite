<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmdb-lite security</title>
<style>
:root { color-scheme: dark; --bg:#0b141c; --panel:#122330; --line:#284956; --text:#e7f1f7; --muted:#9bb4c5; --accent:#2dd4bf; --error:#fca5a5; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
main { max-width:48rem; margin:0 auto; padding:2rem 1rem; }
a { color:var(--accent); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; margin:.8rem 0; }
h1 { margin:0 0 .3rem; font-size:1.4rem; }
h2 { margin:0 0 .5rem; font-size:1rem; }
p, label, li { color:var(--muted); font-size:.9rem; }
label { display:block; margin:.6rem 0 .2rem; }
input,button { font:inherit; padding:.5rem .6rem; border-radius:7px; border:1px solid var(--line); background:#0e1c26; color:var(--text); }
button { margin-top:.6rem; background:var(--accent); color:#04110f; border:0; font-weight:700; cursor:pointer; }
button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
.error { color:var(--error); min-height:1.2em; font-size:.85rem; }
.hidden { display:none !important; }
code, .secret { font-family:ui-monospace,monospace; word-break:break-all; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:end; }
.row > label { flex:1 1 12rem; }
.codes { columns:2; padding-left:1.2rem; }
</style>
</head>
<body>
<main>
  <p><a href="/">← Back to inventory</a></p>
  <h1>Account security</h1>
  <p id="user-line">Loading…</p>
  <p id="error" class="error" role="alert"></p>

  <section class="card">
    <h2>Authenticator app (TOTP)</h2>
    <p id="totp-status">Loading…</p>
    <button id="totp-start" type="button">Set up authenticator</button>
    <div id="totp-setup" class="hidden">
      <p>Add this secret to your authenticator app, then enter the 6-digit code.</p>
      <p class="secret" id="totp-secret"></p>
      <p class="secret" id="totp-uri"></p>
      <div class="row">
        <label>Code <input id="totp-code" inputmode="numeric" autocomplete="one-time-code"></label>
        <button id="totp-confirm" type="button">Confirm</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Recovery codes</h2>
    <p>Generate ten one-time recovery codes. They are shown once and replace any previous codes.</p>
    <button id="recovery-generate" type="button">Generate recovery codes</button>
    <ul id="recovery-codes" class="codes hidden"></ul>
  </section>

  <section class="card">
    <h2>Change password</h2>
    <form id="password-form">
      <label>Current password <input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>New password <input id="new-password" type="password" autocomplete="new-password" required></label>
      <button type="submit">Change password</button>
    </form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let csrf = "";
let user = null;
async function api(url, options = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (csrf) headers["X-CSRF-Token"] = csrf;
  const response = await fetch(url, { ...options, headers });
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error((data.error && data.error.message) || "Request failed");
  return data;
}
async function init() {
  try {
    const session = await api("/api/v1/auth/session");
    csrf = session.csrf;
    user = session.user;
    $("user-line").textContent = `${user.username}${user.is_admin ? " · administrator" : ""}`;
    $("totp-status").textContent = user.totp_enabled ? "TOTP is enabled." : "TOTP is not enabled.";
    $("totp-start").classList.toggle("hidden", user.totp_enabled);
  } catch (error) {
    location.href = "/login";
  }
}
$("totp-start").addEventListener("click", async () => {
  $("error").textContent = "";
  try {
    const data = await api("/api/v1/auth/totp/setup", { method: "POST", body: "{}" });
    $("totp-secret").textContent = data.secret;
    $("totp-uri").textContent = data.uri;
    $("totp-setup").classList.remove("hidden");
    $("totp-start").classList.add("hidden");
  } catch (error) { $("error").textContent = error.message; }
});
$("totp-confirm").addEventListener("click", async () => {
  $("error").textContent = "";
  try {
    await api("/api/v1/auth/totp/confirm", { method: "POST", body: JSON.stringify({ code: $("totp-code").value.trim() }) });
    $("totp-status").textContent = "TOTP is enabled.";
    $("totp-setup").classList.add("hidden");
    user.totp_enabled = true;
  } catch (error) { $("error").textContent = error.message; }
});
$("recovery-generate").addEventListener("click", async () => {
  $("error").textContent = "";
  if (!confirm("Generate a new set of recovery codes? Existing codes will stop working.")) return;
  try {
    const data = await api("/api/v1/auth/recovery/generate", { method: "POST", body: "{}" });
    const list = $("recovery-codes");
    list.replaceChildren();
    for (const code of data.codes) {
      const item = document.createElement("li");
      item.textContent = code;
      list.append(item);
    }
    list.classList.remove("hidden");
  } catch (error) { $("error").textContent = error.message; }
});
$("password-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("error").textContent = "";
  try {
    await api("/api/v1/auth/password", { method: "POST", body: JSON.stringify({ current: $("current-password").value, new: $("new-password").value }) });
    $("current-password").value = "";
    $("new-password").value = "";
    alert("Password changed.");
  } catch (error) { $("error").textContent = error.message; }
});
init();
</script>
</body>
</html>
