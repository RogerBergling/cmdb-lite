<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmdb-lite login</title>
<style>
:root { color-scheme: dark; --bg:#0b141c; --panel:#122330; --line:#284956; --text:#e7f1f7; --muted:#9bb4c5; --accent:#2dd4bf; --error:#fca5a5; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#173247,#0b141c 55%); color:var(--text); font-family:system-ui,sans-serif; }
.card { width:min(26rem,calc(100% - 2rem)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.4rem; box-shadow:0 20px 60px rgba(0,0,0,.35); }
h1 { margin:0 0 .2rem; font-size:1.25rem; }
p { color:var(--muted); font-size:.9rem; }
label { display:block; margin:.7rem 0 .25rem; font-size:.82rem; color:var(--muted); }
input,button { width:100%; font:inherit; padding:.55rem .65rem; border-radius:8px; border:1px solid var(--line); background:#0e1c26; color:var(--text); }
button { margin-top:1rem; background:var(--accent); color:#04110f; border:0; font-weight:700; cursor:pointer; }
button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
.error { color:var(--error); min-height:1.2em; font-size:.85rem; }
.hidden { display:none !important; }
.secret { margin-top:.8rem; padding:.6rem; border:1px solid var(--line); border-radius:8px; font-family:ui-monospace,monospace; word-break:break-all; }
.small { font-size:.8rem; }
</style>
</head>
<body>
<main class="card">
  <h1>cmdb-lite</h1>
  <p id="subtitle">Sign in to continue.</p>

  <form id="setup-form" class="hidden">
    <label for="setup-token">First-run setup token</label>
    <input id="setup-token" autocomplete="off" required>
    <label for="setup-user">Admin username</label>
    <input id="setup-user" autocomplete="username" required>
    <label for="setup-pass">Password</label>
    <input id="setup-pass" type="password" autocomplete="new-password" required>
    <label for="setup-pass2">Confirm password</label>
    <input id="setup-pass2" type="password" autocomplete="new-password" required>
    <p class="small">The setup token is printed by the server on first start. Passwords must be at least 12 characters.</p>
    <button type="submit">Create admin account</button>
  </form>

  <form id="login-form" class="hidden">
    <label for="login-user">Username</label>
    <input id="login-user" autocomplete="username" required>
    <label for="login-pass">Password</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>

  <form id="mfa-form" class="hidden">
    <p>Enter your authenticator code or a one-time recovery code.</p>
    <label for="mfa-code">Code</label>
    <input id="mfa-code" autocomplete="one-time-code" inputmode="numeric" required>
    <button type="submit">Verify</button>
    <button id="mfa-recovery-toggle" type="button" class="secondary">Use a recovery code</button>
  </form>

  <p id="error" class="error" role="alert"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mfaMode = "totp";
async function post(url, body) {
  const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error((data.error && data.error.message) || "Request failed");
  return data;
}
function showForm(name) {
  for (const id of ["setup-form", "login-form", "mfa-form"]) $(id).classList.toggle("hidden", id !== name);
}
async function init() {
  try {
    const response = await fetch("/api/v1/auth/status");
    const status = await response.json();
    if (status.setup_required) {
      $("subtitle").textContent = "Create the first administrator account.";
      showForm("setup-form");
    } else if (status.authenticated) {
      location.href = "/";
    } else if (status.mfa_required) {
      $("subtitle").textContent = "Complete multi-factor authentication.";
      showForm("mfa-form");
    } else {
      showForm("login-form");
    }
  } catch (error) {
    $("error").textContent = error.message;
  }
}
$("setup-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("error").textContent = "";
  if ($("setup-pass").value !== $("setup-pass2").value) { $("error").textContent = "Passwords do not match."; return; }
  try {
    await post("/api/v1/auth/setup", { token: $("setup-token").value.trim(), username: $("setup-user").value.trim(), password: $("setup-pass").value });
    location.href = "/";
  } catch (error) { $("error").textContent = error.message; }
});
$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("error").textContent = "";
  try {
    const data = await post("/api/v1/auth/login", { username: $("login-user").value.trim(), password: $("login-pass").value });
    if (data.mfa_required) { $("subtitle").textContent = "Complete multi-factor authentication."; showForm("mfa-form"); }
    else location.href = "/";
  } catch (error) { $("error").textContent = error.message; }
});
$("mfa-recovery-toggle").addEventListener("click", () => {
  mfaMode = mfaMode === "totp" ? "recovery" : "totp";
  $("mfa-recovery-toggle").textContent = mfaMode === "totp" ? "Use a recovery code" : "Use an authenticator code";
  $("mfa-code").inputMode = mfaMode === "totp" ? "numeric" : "text";
});
$("mfa-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("error").textContent = "";
  try {
    await post(mfaMode === "totp" ? "/api/v1/auth/mfa" : "/api/v1/auth/recovery", { code: $("mfa-code").value.trim() });
    location.href = "/";
  } catch (error) { $("error").textContent = error.message; }
});
init();
</script>
</body>
</html>
