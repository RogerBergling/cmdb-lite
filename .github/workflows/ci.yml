name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GTK3 / WebKitGTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            fakeroot dpkg-dev \
            libsqlcipher-dev libsodium-dev libexpat1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check embedded web UI
        run: python3 packaging/embed_web.py --check

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMDB_BUILD_UI=ON \
            -DCMDB_BUILD_TESTS=ON \
            -DCMDB_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Linux packages
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cpack --config build/CPackConfig.cmake -G TGZ -B dist
          dpkg-deb -I dist/*.deb | head -25

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: cmdb-lite-linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

      - name: Whitespace check
        run: git diff --check

  fedora:
    name: Fedora (GTK3 / WebKitGTK, RPM)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ cmake ninja-build pkgconf-pkg-config git python3 \
            findutils rpm-build \
            sqlcipher-devel libsodium-devel libsodium-static \
            openssl-devel zlib-devel expat-devel \
            gtk3-devel webkit2gtk4.1-devel

      - name: Check embedded web UI
        run: python3 packaging/embed_web.py --check

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMDB_BUILD_UI=ON \
            -DCMDB_BUILD_TESTS=ON \
            -DCMDB_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Fedora packages
        run: |
          cpack --config build/CPackConfig.cmake -G RPM -B dist
          cpack --config build/CPackConfig.cmake -G TGZ -B dist
          rpm -qip dist/*.rpm

      - name: Upload Fedora packages
        uses: actions/upload-artifact@v4
        with:
          name: cmdb-lite-fedora-x86_64
          path: |
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

      - name: Whitespace check
        run: git diff --check

  windows:
    name: Windows (WebView2)
    # windows-2022 provides the Visual Studio 2022 C++ toolchain expected by
    # setup-windows.ps1 and the CMake generator.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          if (!(Test-Path "$vcpkgRoot\vcpkg.exe")) {
            throw "vcpkg not found at $vcpkgRoot"
          }
          & "$vcpkgRoot\vcpkg.exe" install `
            sqlcipher:x64-windows-static `
            libsodium:x64-windows-static `
            expat:x64-windows-static
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMDB_BUILD_UI=ON `
            -DCMDB_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: GUI smoke test (WebView2)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "cmdb-smoke.json"
          $db = Join-Path $env:RUNNER_TEMP "cmdb-smoke.cmdb"
          Remove-Item $result, $db, "$db.meta", "$db-wal", "$db-shm" `
            -ErrorAction SilentlyContinue
          $env:CMDB_SMOKE_TEST = "1"
          $env:CMDB_SMOKE_DB = $db
          $env:CMDB_SMOKE_RESULT = $result
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "cmdb-webview2"
          $proc = Start-Process -FilePath "build\Release\cmdb.exe" -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw "cmdb.exe did not exit within 60 seconds"
          }
          if ($proc.ExitCode -ne 0) {
            throw "cmdb.exe exited with $($proc.ExitCode)"
          }
          if (!(Test-Path $result)) {
            throw "Smoke result file was not written"
          }
          Get-Content $result -Raw
          $data = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $data.ready) {
            throw "UI did not become ready: $($data.error)"
          }
          if ($data.database -ne "ok") {
            throw "Database smoke test failed: $($data.database)"
          }

      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No signing certificate configured; skipping."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cmdb-lite.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }
          & $signtool.FullName sign /f $pfx `
            /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            build\Release\cmdb.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Signing cmdb.exe failed"
          }

      - name: Create portable package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          if (!(Test-Path "package\bin\cmdb.exe")) {
            throw "cmdb.exe was not installed"
          }
          $dlls = Get-ChildItem "package\bin" -Filter *.dll -ErrorAction SilentlyContinue
          if ($dlls) {
            throw "Unexpected DLL dependencies in the static package: $($dlls.Name -join ', ')"
          }
          Compress-Archive -Path "package\*" -DestinationPath "cmdb-lite-windows-x64.zip" -Force

      - name: Locate WiX Toolset
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" `
            -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixRoot) {
            choco install wixtoolset --no-progress -y
            $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" `
              -Directory | Select-Object -First 1
          }
          if (-not $wixRoot) {
            throw "WiX Toolset was not found"
          }
          $wixBin = Join-Path $wixRoot.FullName "bin"
          if (!(Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "candle.exe was not found in $wixBin"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX: $wixBin"

      - name: Build MSI
        shell: pwsh
        run: |
          cpack --config build\CPackConfig.cmake -C Release -G WIX -B dist
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            throw "No MSI was produced"
          }
          Write-Host "MSI: $($msi.FullName) ($($msi.Length) bytes)"

      - name: Sign Windows MSI
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No signing certificate configured; skipping."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cmdb-lite.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            throw "MSI was not found"
          }
          & $signtool.FullName sign /f $pfx `
            /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            $msi.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Signing the MSI failed"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cmdb-lite-windows-x64
          path: |
            cmdb-lite-windows-x64.zip
            dist/*.msi
          if-no-files-found: error

      - name: Whitespace check
        shell: pwsh
        run: git diff --check
