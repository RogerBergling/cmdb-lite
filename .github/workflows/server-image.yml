name: Server image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: server/go.sum

      - name: Test server behavior
        run: |
          cd server
          go test ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogerbergling/cmdb-lite-server
          labels: |
            org.opencontainers.image.title=cmdb-lite server
            org.opencontainers.image.description=Single-node cmdb-lite server with external TLS proxy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMDB_BUILD_NUMBER=${{ github.run_number }}
            CMDB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test the image
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            image="ghcr.io/rogerbergling/cmdb-lite-server:pr-${{ github.event.number }}"
          else
            image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          fi
          echo "Testing $image"
          cleanup() {
            docker logs cmdb-smoke 2>/dev/null || true
            docker rm -f cmdb-smoke 2>/dev/null || true
            docker volume rm cmdb-smoke-data 2>/dev/null || true
          }
          trap cleanup EXIT
          docker volume create cmdb-smoke-data >/dev/null
          docker run --rm -v cmdb-smoke-data:/data \
            -e CMDB_DB_PASSPHRASE=smoke-only-passphrase \
            "$image" --db /data/smoke.cmdb --create-db
          docker run -d --name cmdb-smoke \
            -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m,mode=1777 \
            -v cmdb-smoke-data:/data \
            -e CMDB_DB_PASSPHRASE=smoke-only-passphrase \
            -e CMDB_DB_PATH=/data/smoke.cmdb \
            -e CMDB_LISTEN=0.0.0.0:8080 \
            -e CMDB_PROXY=127.0.0.1/32 \
            --memory 1g --pids-limit 256 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            "$image"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/readyz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/api/v1/auth/status | grep -q '"setup_required":true'
          docker exec cmdb-smoke nmap --version | grep -q 'Nmap version'
          docker exec cmdb-smoke nmap -sT -Pn -n -p 8080 127.0.0.1 \
            | grep -q '8080/tcp open'
