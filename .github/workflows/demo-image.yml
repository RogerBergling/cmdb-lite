name: Demo image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build demo image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: server/go.sum

      - name: Test demo server behavior
        run: |
          cd server
          go test -tags demo ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogerbergling/cmdb-lite-demo
          labels: |
            org.opencontainers.image.title=cmdb-lite demo
            org.opencontainers.image.description=Public demo of cmdb-lite with fake data
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMDB_BUILD_NUMBER=${{ github.run_number }}
            CMDB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test the PR image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="ghcr.io/rogerbergling/cmdb-lite-demo:pr-${{ github.event.number }}"
          cleanup() {
            docker logs demo-smoke 2>/dev/null || true
            docker rm -f demo-smoke 2>/dev/null || true
            docker volume rm demo-smoke-data 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name demo-smoke \
            -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            -v demo-smoke-data:/data \
            --memory 1g --pids-limit 256 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            "$image"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/login | grep -q "Public demo"
          curl -fsS http://127.0.0.1:8080/api/v1/demo/status | grep -q '"username":"guest"'
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"guest","password":"guest"}' \
            http://127.0.0.1:8080/api/v1/auth/login | grep -q '"mfa_required":true'

      - name: Smoke test the pushed image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "Testing $image"
          cleanup() {
            docker logs demo-smoke-pushed 2>/dev/null || true
            docker rm -f demo-smoke-pushed 2>/dev/null || true
            docker volume rm demo-smoke-pushed-data 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name demo-smoke-pushed \
            -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            -v demo-smoke-pushed-data:/data \
            --memory 1g --pids-limit 256 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            "$image"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/login | grep -q "Public demo"
          curl -fsS http://127.0.0.1:8080/api/v1/demo/status | grep -q '"username":"guest"'
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"guest","password":"guest"}' \
            http://127.0.0.1:8080/api/v1/auth/login | grep -q '"mfa_required":true'
